name: Test counterexamples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run canonicalization counterexample
        run: python3 canonicalization/canonicalization_counterexample.py
      - name: Run regression tests
        working-directory: canonicalization
        run: python3 -m unittest -v test_canonicalization_counterexample.py
