name: Test counterexamples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run canonicalization counterexample
        run: python3 canonicalization/canonicalization_counterexample.py
      - name: Run regression tests
        working-directory: canonicalization
        run: python3 -m unittest -v test_canonicalization_counterexample.py
      - name: Run issuer-to-origin counterexamples
        run: python3 issuer-origin-binding/issuer_origin_binding_counterexample.py
      - name: Run issuer-to-origin regression tests
        working-directory: issuer-origin-binding
        run: python3 -m unittest -v test_issuer_origin_binding_counterexample.py
      - name: Run hierarchical-matching counterexamples
        run: python3 hierarchical-matching/hierarchical_matching_counterexample.py
      - name: Run hierarchical-matching regression tests
        working-directory: hierarchical-matching
        run: python3 -m unittest -v test_hierarchical_matching_counterexample.py
